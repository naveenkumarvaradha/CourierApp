#! redis-deployment.yaml
# Generated code, do not edit
apiVersion: apps/v1
kind: Deployment
metadata:
    name: redis
    namespace: courierapp
    labels:
        com.docker.compose.project: courierapp
        com.docker.compose.service: redis
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: courierapp
            com.docker.compose.service: redis
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: courierapp
                com.docker.compose.service: redis
                com.docker.compose.network.default: "true"
        spec:
            restartPolicy: Always
            containers:
                - name: shipdesk-redis
                  image: redis:7-alpine
                  imagePullPolicy: IfNotPresent
                  args:
                    - redis-server
                    - --appendonly
                    - yes
                    - --requirepass
                    - redis_pass
                  livenessProbe:
                    exec:
                        command: ["redis-cli", "-a", "redis_pass", "ping"]
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 5
                  ports:
                    - name: redis-6379
                      containerPort: 6379
                  volumeMounts:
                    - name: data
                      mountPath: /data
            volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: redis-redisdata
