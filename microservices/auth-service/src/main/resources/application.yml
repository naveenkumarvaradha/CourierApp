server:
  port: 8081
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/courierdb}
    username: ${SPRING_DATASOURCE_USERNAME:courier_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 5000
      pool-name: AuthHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false   # Monolith owns migrations; auth-service just connects
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      timeout: 2000ms
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 15000
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    listener:
      missing-topics-fatal: false

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-token-expiry-minutes: 60
    refresh-token-expiry-days: 7
  internal:
    secret: ${APP_INTERNAL_SECRET}
  cookie:
    # Requires HTTPS. Only set COOKIE_SECURE=false for local HTTP-only dev
    # (e.g. `mvn spring-boot:run` without TLS) — never in a real deployment.
    secure: ${COOKIE_SECURE:true}
  mfa:
    issuer: CourierApp
  name: Courier Booking
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  login:
    max-failed-attempts: 5
    lockout-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: WARN
    com.courierapp.auth: INFO
    org.springframework.security: WARN
