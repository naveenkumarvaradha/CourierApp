server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service routes — public + protected auth endpoints
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # Booking Service routes
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**, /api/dashboard/**
          filters:
            - StripPrefix=0

        # Party Service routes
        - id: party-service
          uri: lb://party-service
          predicates:
            - Path=/api/parties/**
          filters:
            - StripPrefix=0

        # Admin Service routes
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0

        # Notification Service routes
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0

        # Report Service routes
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=0

        # System Status — handled by auth-service
        - id: system-status
          uri: lb://auth-service
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=0

  main:
    web-application-type: reactive

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:admin123}@${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-to-a-secure-256bit-key-in-production-must-be-very-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
