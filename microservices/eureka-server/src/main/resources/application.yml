server:
  port: 8761

spring:
  application:
    name: eureka-server
  security:
    user:
      name: ${EUREKA_USERNAME:admin}
      password: ${EUREKA_PASSWORD}

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD}@localhost:8761/eureka/

eureka.security:
  username: ${EUREKA_USERNAME:admin}
  password: ${EUREKA_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
