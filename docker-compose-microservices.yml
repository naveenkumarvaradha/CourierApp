services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: shipdesk-ms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: courierdb
      POSTGRES_USER: courier_user
      POSTGRES_PASSWORD: courier_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier_user -d courierdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shipdesk-ms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: shipdesk-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Kafka ─────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: shipdesk-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Eureka Service Registry ────────────────────────────────────────────────
  eureka-server:
    build:
      context: ./microservices/eureka-server
      dockerfile: Dockerfile
    container_name: shipdesk-eureka
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile
    container_name: shipdesk-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Auth Service ──────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: shipdesk-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courierdb
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: courier_pass
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis_pass
      # JWT
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-secure-256bit-key-in-production-must-be-very-long}
      # Mail
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Booking Service ───────────────────────────────────────────────────────
  booking-service:
    build:
      context: ./microservices/booking-service
      dockerfile: Dockerfile
    container_name: shipdesk-booking-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courierdb
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: courier_pass
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # JWT
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-secure-256bit-key-in-production-must-be-very-long}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: booking-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Party Service ─────────────────────────────────────────────────────────
  party-service:
    build:
      context: ./microservices/party-service
      dockerfile: Dockerfile
    container_name: shipdesk-party-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courierdb
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: courier_pass
      # JWT
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-secure-256bit-key-in-production-must-be-very-long}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: party-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Admin Service ─────────────────────────────────────────────────────────
  admin-service:
    build:
      context: ./microservices/admin-service
      dockerfile: Dockerfile
    container_name: shipdesk-admin-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courierdb
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: courier_pass
      # JWT
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-secure-256bit-key-in-production-must-be-very-long}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: admin-service
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Notification Service ───────────────────────────────────────────────────
  notification-service:
    build:
      context: ./microservices/notification-service
      dockerfile: Dockerfile
    container_name: shipdesk-notification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Mail
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
