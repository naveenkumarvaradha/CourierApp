services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  # Not published to the host — reachable only from other containers on this
  # compose network. Connect via `docker compose exec postgres psql ...` or a
  # temporary port-forward if you need host access for local debugging.
  postgres:
    image: postgres:15-alpine
    container_name: shipdesk-ms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: courierdb
      POSTGRES_USER: courier_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier_user -d courierdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  # Not published to the host — internal network only.
  redis:
    image: redis:7-alpine
    container_name: shipdesk-ms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Zookeeper ─────────────────────────────────────────────────────────────
  # Not published to the host — internal network only.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: shipdesk-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Kafka ─────────────────────────────────────────────────────────────────
  # Not published to the host — internal network only.
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: shipdesk-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Eureka Service Registry ────────────────────────────────────────────────
  # Published for operator access to the registry dashboard — protected by
  # HTTP Basic auth (EUREKA_USERNAME/EUREKA_PASSWORD, both required below).
  eureka-server:
    build:
      context: ./microservices/eureka-server
      dockerfile: Dockerfile
    container_name: shipdesk-eureka
    restart: unless-stopped
    environment:
      SERVER_PORT: 8761
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── API Gateway ───────────────────────────────────────────────────────────
  # Not published to the host — the frontend's nginx reverse-proxies /api/*
  # to this service over the internal docker network, so the browser only
  # ever talks to nginx on 443. This also means no CORS is needed for real
  # traffic; the gateway's CORS config remains only as a safety net for
  # direct API testing from the internal network.
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile
    container_name: shipdesk-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}@eureka-server:8761/eureka/
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in your .env file to a random 256-bit value}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:?Set APP_INTERNAL_SECRET in your .env file to a random value}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Auth Service ──────────────────────────────────────────────────────────
  # Not published to the host — reachable only via the API Gateway (or other
  # containers on this network). Direct access would let identity headers be
  # forged; APP_INTERNAL_SECRET guards against that even on the internal network.
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: shipdesk-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courierdb
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}
      # JWT / internal service auth
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in your .env file to a random 256-bit value}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:?Set APP_INTERNAL_SECRET in your .env file to a random value}
      # Mail
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Booking Service ───────────────────────────────────────────────────────
  # Not published to the host — reachable only via the API Gateway.
  booking-service:
    build:
      context: ./microservices/booking-service
      dockerfile: Dockerfile
    container_name: shipdesk-booking-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courierdb
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # JWT / internal service auth
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in your .env file to a random 256-bit value}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:?Set APP_INTERNAL_SECRET in your .env file to a random value}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: booking-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Party Service ─────────────────────────────────────────────────────────
  # Not published to the host — reachable only via the API Gateway.
  party-service:
    build:
      context: ./microservices/party-service
      dockerfile: Dockerfile
    container_name: shipdesk-party-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courierdb
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      # JWT / internal service auth
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in your .env file to a random 256-bit value}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:?Set APP_INTERNAL_SECRET in your .env file to a random value}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: party-service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Admin Service ─────────────────────────────────────────────────────────
  # Not published to the host — reachable only via the API Gateway.
  admin-service:
    build:
      context: ./microservices/admin-service
      dockerfile: Dockerfile
    container_name: shipdesk-admin-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      # Database (admin-service reads DB_URL/DB_USERNAME/DB_PASSWORD, not SPRING_DATASOURCE_*)
      DB_URL: jdbc:postgresql://postgres:5432/courierdb
      DB_USERNAME: courier_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      # JWT / internal service auth
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in your .env file to a random 256-bit value}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:?Set APP_INTERNAL_SECRET in your .env file to a random value}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: admin-service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Notification Service ───────────────────────────────────────────────────
  # Not published to the host — Kafka consumer only, exposes no REST endpoints.
  notification-service:
    build:
      context: ./microservices/notification-service
      dockerfile: Dockerfile
    container_name: shipdesk-notification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Mail
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: notification-service
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Report Service ────────────────────────────────────────────────────────
  # Not published to the host — reachable only via the API Gateway.
  report-service:
    build:
      context: ./microservices/report-service
      dockerfile: Dockerfile
    container_name: shipdesk-report-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      # Database (report-service reads DB_URL/DB_USERNAME/DB_PASSWORD, not SPRING_DATASOURCE_*)
      DB_URL: jdbc:postgresql://postgres:5432/courierdb
      DB_USERNAME: courier_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      # JWT / internal service auth
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in your .env file to a random 256-bit value}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:?Set APP_INTERNAL_SECRET in your .env file to a random value}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:?Set EUREKA_PASSWORD in your .env file}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: report-service
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── React Frontend (Nginx) ────────────────────────────────────────────────
  # The only host-published HTTP(S) entry point. Terminates TLS and reverse-
  # proxies /api/* to api-gateway over the internal network (see nginx.conf.template).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative path — same-origin now that nginx proxies /api internally.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: shipdesk-ms-frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api-gateway:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  pgdata:
    name: shipdesk-ms-pgdata
  redisdata:
    name: shipdesk-ms-redisdata
