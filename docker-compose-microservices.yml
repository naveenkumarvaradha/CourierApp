      retries: 5
      start_period: 90s

  # ── Report Service ────────────────────────────────────────────────────────
  report-service:
    build:
      context: ./microservices/report-service
      dockerfile: Dockerfile
    container_name: shipdesk-report-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courierdb
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: courier_pass
      # JWT
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-secure-256bit-key-in-production-must-be-very-long}
      # Eureka
      EUREKA_HOST: eureka-server
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:-admin123}@eureka-server:8761/eureka/
      SPRING_APPLICATION_NAME: report-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── React Frontend (Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://192.168.2.245:8080/api}
    container_name: shipdesk-ms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  pgdata:
    name: shipdesk-ms-pgdata
  redisdata:
    name: shipdesk-ms-redisdata
