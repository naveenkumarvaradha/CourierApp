services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  # Not published to the host — reachable only from the backend container.
  postgres:
    image: postgres:15-alpine
    container_name: shipdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: courierdb
      POSTGRES_USER: courier_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier_user -d courierdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  # Not published to the host — reachable only from the backend container.
  redis:
    image: redis:7-alpine
    container_name: shipdesk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ───────────────────────────────────────────────────
  # Not published to the host — the frontend's nginx reverse-proxies /api/*
  # to this service over the internal docker network.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shipdesk-backend
    restart: unless-stopped
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courierdb
      SPRING_DATASOURCE_USERNAME: courier_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file}
      # App
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      # JWT secret — must be a random 256-bit value, e.g. `openssl rand -base64 48`
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in your .env file to a random 256-bit value}
      # Mail (set these in .env file for real email)
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── React Frontend (Nginx) ────────────────────────────────────────────────
  # The only host-published HTTP(S) entry point. Terminates TLS and reverse-
  # proxies /api/* to backend over the internal network (see nginx.conf.template).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative path — same-origin now that nginx proxies /api internally.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: shipdesk-frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    name: shipdesk-pgdata
  redisdata:
    name: shipdesk-redisdata
